name: Build ANDROMEDA plugin (macOS)
on:
  push:
    branches: [main]
    paths: ['engine/**', 'plugin/**', 'ui/**', 'installer/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S plugin -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build VST3 + AU + Standalone
        run: cmake --build build --config Release -j 4 -- -quiet
      - name: Sign (ad-hoc) and package
        run: |
          set -e
          A=build/Andromeda_artefacts/Release
          mkdir -p pkg/ANDROMEDA
          cp -R "$A/VST3/ANDROMEDA.vst3" pkg/ANDROMEDA/
          cp -R "$A/AU/ANDROMEDA.component" pkg/ANDROMEDA/
          cp -R "$A/Standalone/ANDROMEDA.app" pkg/ANDROMEDA/
          for b in pkg/ANDROMEDA/*.vst3 pkg/ANDROMEDA/*.component pkg/ANDROMEDA/*.app; do codesign --force --deep -s - "$b"; done
          cp installer/Install\ ANDROMEDA.command installer/LEEME.txt installer/README.txt installer/KeyLab-Essential-49.md pkg/ANDROMEDA/
          chmod +x "pkg/ANDROMEDA/Install ANDROMEDA.command"
          cd pkg && ditto -c -k --keepParent ANDROMEDA ../ANDROMEDA-mac.zip
      - name: Validate with pluginval
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pv.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --skip-gui-tests --timeout-ms 300000 --validate build/Andromeda_artefacts/Release/VST3/ANDROMEDA.vst3
      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Andromeda_artefacts/Release/AU/ANDROMEDA.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Andr Plsl
      - uses: actions/upload-artifact@v4
        with:
          name: ANDROMEDA-mac
          path: ANDROMEDA-mac.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ANDROMEDA 1.0.${{ github.run_number }} for Mac (VST3 · AU · App)
          prerelease: false
          make_latest: true
          files: |
            ANDROMEDA-mac.zip
            manual/ANDROMEDA-Manual-Completo-EN-ES.pdf
            manual/ANDROMEDA-Manual-Completo-ES.pdf
            manual/ANDROMEDA-Manual-EN-ES.pdf
            manual/ANDROMEDA-Manual-ES.pdf
            manual/ANDROMEDA-FM1-Manual-EN-ES.pdf
            manual/ANDROMEDA-FM1-Manual-ES.pdf
          body: |
            ANDROMEDA — an ambient instrument · Dark Funk Durcal design · Polaris Sound Lab
            Download ANDROMEDA-mac.zip, unzip it and double-click "Install ANDROMEDA.command" (or paste in Terminal: curl -fsSL https://drophlex.github.io/ANDROMEDA/install.sh | bash).
            Manuals / Manuales (PDF): ANDROMEDA-Manual-Completo-EN-ES.pdf is the complete manual in English and Spanish (web, Mac, Ableton and FM-1); ANDROMEDA-Manual-Completo-ES.pdf, solo en español.
            Quick guide / Guía rápida: https://drophlex.github.io/ANDROMEDA/guide/
